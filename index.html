<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Figuras Geométricas</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Mandarina&family=Tangerine:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>
  <div class="container">
    <h1>Calculadora de Figuras Geométricas</h1>
    
    <div class="input-group">
      <label for="shapeSelect">Selecciona una figura:</label>
      <select id="shapeSelect" onchange="createInputFields()">
        <option value="">-- Selecciona --</option>
        <option value="triangulo-isosceles">Triángulo Isósceles</option>
        <option value="triangulo-rectangulo">Triángulo Rectángulo</option>
        <option value="triangulo-equilatero">Triángulo Equilátero</option>
        <option value="circulo-elipse">Círculo/Elipse</option>
        <option value="rectangulo">Rectángulo</option>
        <option value="rombo">Rombo</option>
      </select>
    </div>

    <div id="inputContainer"></div>
    
    <button onclick="calculate()">Calcular</button>
    
    <div id="result">
      <div class="result-item"><strong>Área:</strong> <span id="areaResult"></span> u<sup>2</sup></div>
      <div class="result-item"><strong>Perímetro:</strong> <span id="perimetroResult"></span> u</div>
    </div>

    <div id="procedure" style="display:none;">
      <h2>Procedimiento</h2>
      <p id="procedureText"></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/script.js"></script>
</body>
<footer>
    <p>Proyecto Final Lenguajes de Programación 1000</p>
    <p>Autores: Hugo Ramírez, Yeison Orellana, Jean Carlos González, Rolando Aguilar</p>
  </footer>
  
</html>
